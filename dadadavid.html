  <style>
    body { font-family: 'DM Sans', sans-serif; }

    .spinner-ring {
      width: 120px; height: 120px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, #818cf8 40%, #c084fc 70%, transparent 100%);
      animation: spin 1.5s linear infinite;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner-ring::after {
      content: ''; width: 100px; height: 100px; border-radius: 50%;
      background: #1e1b2e;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .glow {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle, rgba(129,140,248,0.4) 0%, transparent 70%);
      animation: glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.6); opacity: 0.15; }
    }

    .pulse-ring {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      border: 2px solid rgba(129,140,248,0.3);
      animation: pulse-out 3s ease-out infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: 1s; }
    @keyframes pulse-out {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(3); opacity: 0; }
    }

    .sub-pulse { animation: sub-fade 3s ease-in-out infinite; }
    @keyframes sub-fade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .cursor-ripple {
      position: fixed; pointer-events: none;
    }
    .cursor-icon {
      width: 24px; height: 24px; opacity: 0.7;
    }
    .cursor-icon svg {
      width: 100%; height: 100%; stroke-width: 2;
    }
    .ripple-ring {
      position: absolute; width: 60px; height: 60px; border: 2px solid;
      border-radius: 50%; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: ripple-expand 1.5s ease-out forwards;
    }
    @keyframes ripple-expand {
      0% { width: 60px; height: 60px; opacity: 0.8; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }
